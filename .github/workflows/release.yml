name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            build-args: --win
            artifact: dist/RadioSwissClassicPlayer-Setup-*.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npx electron-builder ${{ matrix.build-args }} --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Upload artifacts to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.artifact }}
          fail_on_unmatched_files: true
          generate_release_notes: true

  native-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: aarch64-apple-darwin, x86_64-apple-darwin
      - run: cargo fmt --check
      - run: cargo clippy --locked -- -D warnings
      - name: Build native universal app
        run: scripts/build-macos.sh --universal
      - name: Package
        run: ditto -c -k --sequesterRsrc --keepParent "dist/Radio Swiss Classic.app" dist/RadioSwissClassic-native-universal.zip
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/RadioSwissClassic-native-universal.zip
          fail_on_unmatched_files: true
          generate_release_notes: true
