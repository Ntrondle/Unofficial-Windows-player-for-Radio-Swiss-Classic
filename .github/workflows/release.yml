name: Release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  native-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --check
      - run: cargo clippy --locked -- -D warnings
      - run: cargo test --locked
      - name: Install installer compiler
        run: choco install innosetup --no-progress -y
      - name: Build native executable and installer
        run: ./scripts/build-windows.ps1
      - name: Check native UI and live metadata
        run: ./scripts/test-windows.ps1
      - name: Check playback if an audio endpoint is available
        continue-on-error: true
        run: ./scripts/test-windows.ps1 -Playback
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-windows
          path: dist/*
          if-no-files-found: error
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            dist/RadioSwissClassicPlayer-Setup-*.exe
            dist/RadioSwissClassic-native-windows-x64.zip
          fail_on_unmatched_files: true
          generate_release_notes: true

  native-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: aarch64-apple-darwin, x86_64-apple-darwin
      - run: cargo fmt --check
      - run: cargo clippy --locked -- -D warnings
      - run: cargo test --locked
      - name: Build native universal app
        run: scripts/build-macos.sh --universal
      - name: Package
        run: ditto -c -k --sequesterRsrc --keepParent "dist/Radio Swiss Classic.app" dist/RadioSwissClassic-native-universal.zip
      - uses: actions/upload-artifact@v4
        with:
          name: native-macos
          path: dist/*.zip
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: dist/RadioSwissClassic-native-universal.zip
          fail_on_unmatched_files: true
          generate_release_notes: true
