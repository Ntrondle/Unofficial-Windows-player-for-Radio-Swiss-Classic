[package]
name = "radio-swiss-classic"
version = "2.1.0"
edition = "2021"
license = "GPL-3.0-only"
description = "Native Windows and macOS Radio Swiss Classic player"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-core-graphics = { version = "0.3", default-features = false, features = ["std", "CGColor", "objc2"] }
objc2-foundation = { version = "0.3", features = ["NSGeometry", "NSString", "NSObject"] }
curl = { version = "0.4", default-features = false, features = ["force-system-lib-on-osx"] }
[target.'cfg(target_os = "windows")'.dependencies]
windows-core = "0.62"
windows = { version = "0.62", features = [
  "Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Graphics_Imaging",
  "Win32_Media_MediaFoundation", "Win32_Networking_WinHttp",
  "Win32_System_Com", "Win32_System_LibraryLoader", "Win32_System_Registry",
  "Win32_System_Threading", "Win32_System_SystemServices", "Win32_UI_Controls", "Win32_UI_HiDpi",
  "Win32_UI_WindowsAndMessaging", "Win32_Globalization",
  "Win32_UI_Shell_PropertiesSystem", "Win32_System_Com_StructuredStorage",
] }

[target.'cfg(target_os = "windows")'.build-dependencies]
winresource = "0.1"

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"
