<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; media-src https: http://*.srg-ssr.ch; style-src 'self'">
  <title>Radio Swiss Classic</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <img id="logo" src="assets/logo.png" alt="Radio Swiss Classic">

    <section id="now-playing">
      <div id="track-label">Currently playing</div>
      <div id="track-title">&hellip;</div>
      <div id="track-artist"></div>
    </section>

    <button id="play-stop" aria-label="Play">
      <svg id="icon-play" viewBox="0 0 24 24" width="26" height="26">
        <path d="M8 5.14v13.72c0 .8.87 1.3 1.56.9l11.1-6.86a1.05 1.05 0 0 0 0-1.8L9.56 4.24A1.05 1.05 0 0 0 8 5.14z" fill="currentColor"/>
      </svg>
      <svg id="icon-stop" viewBox="0 0 24 24" width="24" height="24" class="hidden">
        <rect x="6" y="6" width="12" height="12" rx="2" fill="currentColor"/>
      </svg>
    </button>

    <footer id="volume-row">
      <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true">
        <path d="M4 9v6h4l5 4V5L8 9H4z" fill="currentColor"/>
        <path d="M15.5 8.5a5 5 0 0 1 0 7" stroke="currentColor" stroke-width="1.6" fill="none" stroke-linecap="round"/>
      </svg>
      <input id="volume" type="range" min="0" max="100" step="1" aria-label="Volume">
    </footer>
  </main>
  <script src="renderer.js"></script>
</body>
</html>
